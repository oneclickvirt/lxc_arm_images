name: Multi-Distro Images Builder
'on':
  workflow_dispatch:
    inputs:
      distro:
        description: Distribution to rebuild
        type: choice
        required: true
        default: debian
        options:
        - debian
        - kali
        - centos
        - almalinux
        - rockylinux
        - fedora
        - opensuse
        - alpine
        - archlinux
        - gentoo
        - openwrt
        - oracle
        - openeuler
        - ubuntu
      release:
        description: Exact configured release or code name
        type: string
        required: true
        default: trixie
permissions:
  contents: write
jobs:
  validated-build:
    uses: ./.github/workflows/hosted-build.yml
    with:
      distro: ${{ inputs.distro }}
      arch: arm64
      kind: container
      scope: current
      release: ${{ inputs.release || '' }}
